apiVersion: v1
kind: ConfigMap
metadata:
  name: task-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  task-manager.json: |
    {
      "uid": "task-manager",
      "title": "Task Manager",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Requests by HTTP status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(task_http_requests_total[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "App CPU by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "rate(task_process_cpu_seconds_total[5m])",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "App resident memory by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "task_process_resident_memory_bytes",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Available replicas by deployment",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"task-manager\"}",
              "refId": "A"
            }
          ]
        }
      ]
    }
