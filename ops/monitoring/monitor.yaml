apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: task-manager
  namespace: task-manager
spec:
  selector:
    matchLabels:
      app: task-manager
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      authorization:
        type: Bearer
        credentials:
          name: task-secrets
          key: token
