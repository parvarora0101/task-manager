apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: task-manager
  namespace: argocd
spec:
  sourceRepos: [REPLACE_REPOSITORY]
  destinations:
    - server: https://kubernetes.default.svc
      namespace: task-manager
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: Role
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager
  namespace: argocd
spec:
  project: task-manager
  source:
    repoURL: REPLACE_REPOSITORY
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions: [ServerSideApply=true]
