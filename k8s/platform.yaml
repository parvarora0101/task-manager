apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-settings
data:
  APP_ORIGIN: http://localhost:3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager
  labels:
    app: task-manager
spec:
  selector:
    app: task-manager
    slot: blue
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: task-preview
spec:
  selector:
    app: task-manager
    slot: green
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-observer
rules:
  - apiGroups: ["", apps]
    resources: [pods, pods/log, services, deployments]
    verbs: [get, list, watch]
